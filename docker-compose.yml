# Готовая БД Catch the Spies: сырьё + stage + feat (витрины).
# Поднять: docker compose up -d
# Первый запуск: restore дампа (3–10 мин). Дальше — секунды.

services:
  db:
    image: postgres:17-alpine
    container_name: spy-flights-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spy
      POSTGRES_PASSWORD: spy
      POSTGRES_DB: spy_flights
    ports:
      - "${SPY_PG_PORT:-5434}:5432"
    volumes:
      - spy_pgdata:/var/lib/postgresql/data
      - ./dump:/dump:ro
      - ./sql/01_restore.sh:/docker-entrypoint-initdb.d/01_restore.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spy -d spy_flights"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

volumes:
  spy_pgdata:
