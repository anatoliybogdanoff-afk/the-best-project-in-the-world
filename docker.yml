
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spy
      POSTGRES_PASSWORD: spy
      POSTGRES_DB: spy_flights
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dump:/dump:ro
      - ./sql/01_restore.sh:/docker-entrypoint-initdb.d/01_restore.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U spy -d spy_flights" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://spy:spy@db:5432/spy_flights
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
      - ./ml:/app/ml:ro
    restart: unless-stopped

volumes:
  postgres_data:
